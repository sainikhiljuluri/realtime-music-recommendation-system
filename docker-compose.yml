# Two API instances behind an nginx load balancer, sharing one Redis cache.
#
#   cp .env.example .env          # then set PSEUDONYM_KEY and ADMIN_API_KEY
#   docker compose up --build -d  # entry point: http://localhost:8080
#
# Artifacts are mounted read-only from ./artifacts-music4all-10k (created by scripts/run_music.py).
name: rtrec

x-api: &api
  build: .
  image: rtrec-api:local
  restart: unless-stopped
  stop_grace_period: 25s
  environment:
    REDIS_URL: redis://redis:6379/0
    CACHE_TTL: "300"
    PSEUDONYM_KEY: ${PSEUDONYM_KEY:?set PSEUDONYM_KEY in .env}
    ADMIN_API_KEY: ${ADMIN_API_KEY:-}
  volumes:
    - ./artifacts-music4all-10k:/app/artifacts:ro
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  api1:
    <<: *api
    container_name: rtrec-api1

  api2:
    <<: *api
    container_name: rtrec-api2

  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["8080:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
