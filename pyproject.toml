[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-music-recommendation-system"
version = "0.1.0"
description = "Two-tower retrieval (PyTorch), FAISS candidate search, LightGBM ranking, Redis caching, FastAPI serving"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "torch>=2.2",
  "faiss-cpu>=1.8",
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.6,<3",
  "redis>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "fakeredis>=2.23,<3", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # long lines are allowed; formatting is not enforced

[tool.ruff.lint.per-file-ignores]
"scripts/openmp_probe.py" = ["I001"]  # torch must be imported before faiss
