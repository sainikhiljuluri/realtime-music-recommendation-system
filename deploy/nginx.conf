# Two API instances behind one entry point.
#
# User affinity: a request is routed by the user id in the path (/recommendations/{id},
# /users/{id}/listens, /users/{id}/recommendations). A user's listen events and recommendations
# therefore land on the same instance, which holds that user's online features in memory.
# Other paths hash on the full URI.
#
# Passive health checks: an instance that fails is skipped for 5 seconds. A failed request is
# retried on the other instance.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log off;

    map $uri $affinity_key {
        ~^/(recommendations|users)/([^/]+) $2;
        default                            $uri;
    }

    upstream rtrec_api {
        hash $affinity_key consistent;
        server api1:8000 max_fails=2 fail_timeout=5s;
        server api2:8000 max_fails=2 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://rtrec_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            # Nginx does not retry non-idempotent requests (POST) unless `non_idempotent` is set, so a
            # listen event is not applied twice by the proxy. The client retries with the same event_id.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 3s;
        }
    }
}
