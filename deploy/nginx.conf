# Two API instances behind one entry point. Passive health checks: an instance that fails is
# skipped for 5 seconds. Requests that fail on one instance are retried on the other.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log off;

    upstream rtrec_api {
        server api1:8000 max_fails=2 fail_timeout=5s;
        server api2:8000 max_fails=2 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://rtrec_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
